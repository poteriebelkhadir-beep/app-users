name: APK HSELY

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "app/**"
      - "public/**"
      - "capacitor.config.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-apk.yml"

# Un seul run à la fois : évite deux générations Android concurrentes
# qui se marchent dessus sur le même dossier android/.
concurrency:
  group: apk-hsely
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Installer Java 21 (requis par Android Gradle Plugin 8.x)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Le SDK Android est déjà présent sur les runners ubuntu-latest de
      # GitHub (ANDROID_HOME défini) : pas besoin d'action supplémentaire
      # pour l'installer, seulement d'accepter les licences et poser la
      # platform-tools attendue par Capacitor.
      - name: Accepter les licences Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Installer les dépendances (lockfile figé)
        run: pnpm install --frozen-lockfile

      - name: Construire le web (client statique)
        run: pnpm build

      - name: Vérifier le dossier de sortie attendu par capacitor.config.json
        run: |
          test -d build/client || { echo "::error::build/client introuvable — ajustez webDir dans capacitor.config.json si votre build sort ailleurs." ; exit 1; }

      # android/ n'est volontairement pas versionné : on le régénère à
      # chaque run à partir de capacitor.config.json + des plugins installés
      # (@capacitor/geolocation, @capacitor/camera), qui fusionnent eux-mêmes
      # leurs permissions dans le AndroidManifest.xml généré.
      - name: Ajouter la plateforme Android si absente
        run: |
          if [ ! -d android ]; then
            pnpm exec cap add android
          fi

      # Les plugins ne fusionnent pas toujours leurs permissions dans le
      # manifest généré : on les injecte nous-mêmes, idempotent (ne les
      # ajoute pas si déjà présentes).
      - name: Ajouter les permissions localisation/caméra au manifest Android
        run: |
          set -e
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          for PERM in \
            "android.permission.ACCESS_FINE_LOCATION" \
            "android.permission.ACCESS_COARSE_LOCATION" \
            "android.permission.CAMERA"
          do
            if ! grep -q "$PERM" "$MANIFEST"; then
              sed -i "/<\/manifest>/i\\    <uses-permission android:name=\"$PERM\" \/>" "$MANIFEST"
            fi
          done
          grep "uses-permission" "$MANIFEST"

      # On évite capacitor-assets (dépend de sharp, qui casse en CI selon
      # la plateforme d'origine du lockfile). ImageMagick redimensionne
      # nous-mêmes le logo HSELY (resources/icon.png, icon-foreground.png)
      # vers chaque résolution mipmap attendue par Android.
      - name: Installer les icônes Android depuis resources/ (ImageMagick)
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          CONVERT="convert"
          command -v convert >/dev/null 2>&1 || CONVERT="magick"
          SRC=resources/icon.png
          FG=resources/icon-foreground.png
          declare -A SIZES=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          for density in "${!SIZES[@]}"; do
            size=${SIZES[$density]}
            dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            $CONVERT "$SRC" -resize "${size}x${size}" "$dir/ic_launcher.png"
            $CONVERT "$SRC" -resize "${size}x${size}" "$dir/ic_launcher_round.png"
            $CONVERT "$FG" -resize "${size}x${size}" "$dir/ic_launcher_foreground.png"
          done

      - name: Synchroniser le web et les plugins natifs
        run: pnpm exec cap sync android

      - name: Autoriser l'exécution du wrapper Gradle
        run: chmod +x android/gradlew

      - name: Compiler l'APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: hsely-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
